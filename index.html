<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de promedio</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>

  <div class="contenedor">
    <h1>Calculadora de promedio</h1>
    <p>Ingresa tres notas (escala 1.0 - 7.0)</p>
    
    <div class="encaje">
      <div>
        <label for="nota1">Nota 1:</label>
        <input type="number" id="nota1" min="1" max="7" step="0.1">
      </div>
      <div>
        <label for="porcentaje1">% 1:</label>
        <input type="number" id="porcentaje1" min="1" max="100" step="1">
      </div>
    </div>
    
    <div class="encaje">
      <div>
        <label for="nota2">Nota 2:</label>
        <input type="number" id="nota2" min="1" max="7" step="0.1">
      </div>
      <div>
        <label for="porcentaje2">% 2:</label>
        <input type="number" id="porcentaje2" min="1" max="100" step="1">
      </div>
    </div>

    <div class="encaje">
      <div>
        <label for="nota3">Nota 3:</label>
        <input type="number" id="nota3" min="1" max="7" step="0.1">
      </div>
      <div>
        <label for="porcentaje3">% 3:</label>
        <input type="number" id="porcentaje3" min="1" max="100" step="1">
      </div>
    </div>

    <div class="encaje">
      <div>
        <label for="nota4">Nota 4:</label>
        <input type="number" id="nota4" min="1" max="7" step="0.1">
      </div>
      <div>
        <label for="porcentaje4">% 4:</label>
        <input type="number" id="porcentaje4" min="1" max="100" step="1">
      </div>
    </div>

    <button id="btnCalcular">Calcular promedio</button>

    <div id="resultado">Resultado</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
